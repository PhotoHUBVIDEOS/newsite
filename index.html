<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="monetag" content="cb81a9cc3fc988b07aa393f9fa2ca685">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoHub — Video Vault</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #121212;
      --bg-elevated: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --indigo: #4f46e5;
      --indigo-hover: #4338ca;
      --border: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(239, 68, 68, 0.15), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(79, 70, 229, 0.17), transparent 36%),
        var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--indigo));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.32);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-title span {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--text-main);
    }

    button,
    a.btn-link {
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s ease, background 0.2s ease, opacity 0.2s ease;
    }

    button:active,
    a.btn-link:active {
      transform: scale(0.97);
    }

    .btn-red {
      background: var(--accent);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.26);
    }

    .btn-red:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-indigo {
      background: var(--indigo);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.26);
    }

    .btn-indigo:hover {
      background: var(--indigo-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-btn.active-nav {
      outline: 2px solid rgba(255, 255, 255, 0.28);
    }

    /* Container & Views */
    .container {
      max-width: 1180px;
      margin: 26px auto 0;
      padding: 0 20px;
    }

    .page-view {
      display: none;
      animation: fadeView 0.24s ease both;
    }

    .page-view.active {
      display: block;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 240px;
    }

    .search-box {
      flex: 1;
      min-width: 210px;
      max-width: 350px;
    }

    input,
    select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select {
      width: auto;
      min-width: 150px;
      cursor: pointer;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.28);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 22px;
    }

    .post-card {
      background: linear-gradient(180deg, #161822 0%, var(--bg-card) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.36);
      transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
    }

    .post-card:hover {
      transform: translateY(-6px);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.52);
    }

    .thumb-box {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      background: var(--bg-elevated);
      overflow: hidden;
      cursor: pointer;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.36s ease;
    }

    .post-card:hover .thumb-box img {
      transform: scale(1.06);
    }

    .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .post-content {
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      flex: 1;
    }

    .post-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge-group {
      background: rgba(79, 70, 229, 0.22);
      color: #a5b4fc;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .badge-manual {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .post-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-footer {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 20px;
      background: var(--bg-card);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      color: var(--text-muted);
    }

    /* Watch View */
    .watch-card {
      max-width: 920px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .watch-hero-img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    video {
      width: 100%;
      max-height: 460px;
      border-radius: 12px;
      background: #000;
      margin-bottom: 16px;
    }

    .watch-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .watch-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .watch-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Studio View */
    .studio-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
    }

    .studio-login-box {
      max-width: 420px;
      margin: 12px auto;
    }

    .studio-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .studio-msg {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
      color: #4ade80;
    }

    .manage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
    }

    .manage-row:last-child {
      border-bottom: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      z-index: 80;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeView {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Shared Navigation -->
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand" id="brandHomeBtn">
        <div class="brand-logo">PH</div>
        <div class="brand-title">Photo<span>Hub</span> Vault</div>
      </div>

      <div class="nav-actions">
        <div class="stat-pill">Total Posts: <strong id="videoCount">0</strong></div>
        <button id="navHomeBtn" class="btn-ghost nav-btn active-nav">Home</button>
        <button id="navStudioBtn" class="btn-indigo nav-btn">Studio</button>
        <button id="logoutBtn" class="btn-ghost" style="display: none;">Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- PAGE 1: HOME / VAULT VIEW -->
    <section id="viewHome" class="page-view active">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search video posts by title..." />
          </div>
          <select id="sortSelect" aria-label="Sort posts">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">Title (A - Z)</option>
          </select>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-filter="all">All Posts</button>
          <button class="tab-btn" data-filter="group">Group Sync</button>
          <button class="tab-btn" data-filter="manual">Studio</button>
        </div>
      </div>

      <div id="videoGrid" class="grid"></div>
    </section>

    <!-- PAGE 2: WATCH / POST DETAIL VIEW -->
    <section id="viewWatch" class="page-view">
      <div style="max-width: 920px; margin: 0 auto 14px;">
        <button id="backFromWatchBtn" class="btn-ghost">← Back to All Posts</button>
      </div>
      <div id="watchCard" class="watch-card">Loading post...</div>
    </section>

    <!-- PAGE 3: STUDIO / ADMIN VIEW -->
    <section id="viewStudio" class="page-view">
      <div id="studioLoginCard" class="studio-card studio-login-box">
        <h2 style="font-size: 19px; margin-bottom: 12px;">Studio Sign In</h2>
        <form id="studioLoginForm" style="display: grid; gap: 12px;">
          <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required />
          <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="btn-red">Sign In</button>
          <div id="loginError" style="color: #f87171; font-size: 13px; min-height: 18px;"></div>
        </form>
      </div>

      <div id="studioDashboard" style="display: none;">
        <div class="studio-card">
          <h2 style="font-size: 19px;">Publish New Video Post</h2>
          <form id="addVideoForm" class="studio-form">
            <input type="text" id="addTitle" placeholder="Video Title" required />
            <input type="url" id="addThumb" placeholder="Thumbnail Photo URL (https://...)" />
            <input type="url" id="addVideo" placeholder="Video URL (.mp4) or Telegram Link" required />
            <button type="submit" class="btn-red">Publish Post</button>
          </form>
          <div id="studioMsg" class="studio-msg"></div>
        </div>

        <div class="studio-card">
          <h3 style="font-size: 17px; margin-bottom: 10px;">Manage Posts</h3>
          <div id="manageList"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const DB_URL = "https://photohub-1f63f-default-rtdb.firebaseio.com";
    const AUTH_USER = "chathumal";
    const AUTH_PASS = "aaaa1234";

    let allVideos = [];
    let currentFilter = "all";
    let currentSort = "newest";
    let isAuthenticated = sessionStorage.getItem("ph_studio_session") === "true";

    const viewHome = document.getElementById("viewHome");
    const viewWatch = document.getElementById("viewWatch");
    const viewStudio = document.getElementById("viewStudio");
    const navHomeBtn = document.getElementById("navHomeBtn");
    const navStudioBtn = document.getElementById("navStudioBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const videoGrid = document.getElementById("videoGrid");
    const videoCount = document.getElementById("videoCount");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const watchCard = document.getElementById("watchCard");
    const studioLoginCard = document.getElementById("studioLoginCard");
    const studioDashboard = document.getElementById("studioDashboard");
    const manageList = document.getElementById("manageList");
    const toastEl = document.getElementById("toast");

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove("show"), 2100);
    }

    function navigateTo(hash) {
      window.location.hash = hash;
    }

    function getWatchUrl(key) {
      const base = window.location.href.split("#")[0];
      return `${base}#watch=${encodeURIComponent(key)}`;
    }

    function syncStudioUI() {
      studioLoginCard.style.display = isAuthenticated ? "none" : "block";
      studioDashboard.style.display = isAuthenticated ? "block" : "none";
      logoutBtn.style.display = isAuthenticated ? "inline-flex" : "none";
      if (isAuthenticated) {
        renderManageList();
      }
    }

    function renderWatchView(postId) {
      const item = allVideos.find((v) => v._key === postId);
      if (!item) {
        watchCard.innerHTML = `
          <p style="color:#94a3b8; margin-bottom:14px;">Post not found or still loading.</p>
          <button class="btn-red" onclick="window.location.hash='#home'">Go to Home</button>
        `;
        return;
      }

      document.title = `${item.title || "Video"} — PhotoHub`;
      const directUrl = item.video_url || "";
      const tgLink = item.bot_link || item.group_link || "";
      const dateStr = item.created_at ? new Date(item.created_at * 1000).toLocaleString() : "";

      const mediaHtml = directUrl.match(/\.(mp4|webm|ogg)(\?.*)?$/i)
        ? `<video src="${escapeHtml(directUrl)}" controls autoplay playsinline></video>`
        : (item.thumb_url
            ? `<img class="watch-hero-img" src="${escapeHtml(item.thumb_url)}" alt="${escapeHtml(item.title || "Thumbnail")}" />`
            : "");

      watchCard.innerHTML = `
        ${mediaHtml}
        <h1 class="watch-title">${escapeHtml(item.title || "Untitled Video")}</h1>
        <div class="watch-meta">${escapeHtml(dateStr)}</div>
        <div class="watch-actions">
          ${tgLink ? `<a class="btn-link btn-indigo" href="${escapeHtml(tgLink)}" target="_blank" rel="noopener noreferrer">Open in Telegram</a>` : ""}
          <button id="copyWatchLinkBtn" class="btn-ghost">Copy Post Link</button>
        </div>
      `;

      document.getElementById("copyWatchLinkBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getWatchUrl(item._key));
          showToast("Post link copied");
        } catch {
          showToast("Copy failed");
        }
      });
    }

    function handleRoute() {
      const rawHash = window.location.hash || "#home";
      viewHome.classList.remove("active");
      viewWatch.classList.remove("active");
      viewStudio.classList.remove("active");
      navHomeBtn.classList.remove("active-nav");
      navStudioBtn.classList.remove("active-nav");

      // Stop playing video when leaving watch view
      const activeVid = watchCard.querySelector("video");
      if (activeVid) activeVid.pause();

      if (rawHash.startsWith("#watch=")) {
        const id = decodeURIComponent(rawHash.slice("#watch=".length));
        viewWatch.classList.add("active");
        renderWatchView(id);
      } else if (rawHash === "#studio") {
        document.title = "Studio — PhotoHub";
        viewStudio.classList.add("active");
        navStudioBtn.classList.add("active-nav");
        syncStudioUI();
      } else {
        document.title = "PhotoHub — Video Vault";
        viewHome.classList.add("active");
        navHomeBtn.classList.add("active-nav");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.addEventListener("hashchange", handleRoute);
    document.getElementById("brandHomeBtn").addEventListener("click", () => navigateTo("#home"));
    navHomeBtn.addEventListener("click", () => navigateTo("#home"));
    navStudioBtn.addEventListener("click", () => navigateTo("#studio"));
    document.getElementById("backFromWatchBtn").addEventListener("click", () => navigateTo("#home"));

    document.getElementById("studioLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value;
      const errEl = document.getElementById("loginError");
      if (u === AUTH_USER && p === AUTH_PASS) {
        isAuthenticated = true;
        sessionStorage.setItem("ph_studio_session", "true");
        errEl.textContent = "";
        e.target.reset();
        syncStudioUI();
        showToast("Signed in to Studio");
      } else {
        errEl.textContent = "Invalid credentials.";
      }
    });

    logoutBtn.addEventListener("click", () => {
      isAuthenticated = false;
      sessionStorage.removeItem("ph_studio_session");
      syncStudioUI();
      showToast("Signed out");
    });

    document.getElementById("addVideoForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!isAuthenticated) return;

      const title = document.getElementById("addTitle").value.trim();
      const thumb_url = document.getElementById("addThumb").value.trim();
      const rawUrl = document.getElementById("addVideo").value.trim();
      const msgEl = document.getElementById("studioMsg");

      const payload = {
        title,
        thumb_url,
        video_url: rawUrl.includes("t.me/") ? "" : rawUrl,
        bot_link: rawUrl.includes("t.me/") ? rawUrl : "",
        source: "manual",
        created_at: Math.floor(Date.now() / 1000)
      };

      const res = await fetch(`${DB_URL}/videos.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        msgEl.style.color = "#4ade80";
        msgEl.textContent = "Published! bot.py watcher will send photo to public group.";
        e.target.reset();
        await fetchVideos();
        setTimeout(() => { msgEl.textContent = ""; }, 4000);
      } else {
        msgEl.style.color = "#f87171";
        msgEl.textContent = "Publish failed.";
      }
    });

    async function deleteVideo(fbKey) {
      if (!isAuthenticated || !fbKey) return;
      const res = await fetch(`${DB_URL}/videos/${encodeURIComponent(fbKey)}.json`, {
        method: "DELETE"
      });
      if (res.ok) {
        await fetchVideos();
        showToast("Post deleted");
      }
    }

    function renderManageList() {
      const sorted = [...allVideos].sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
      manageList.innerHTML = sorted.length
        ? ""
        : `<p style="color:#94a3b8;">No posts available.</p>`;

      sorted.forEach((item) => {
        const row = document.createElement("div");
        row.className = "manage-row";
        row.innerHTML = `
          <div>
            <strong>${escapeHtml(item.title || "Untitled")}</strong>
            <div style="font-size:12px; color:#94a3b8;">ID: ${escapeHtml(item._key)}</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn-indigo open-post-btn">Watch</button>
            <button class="btn-ghost del-post-btn">Delete</button>
          </div>
        `;
        row.querySelector(".open-post-btn").addEventListener("click", () => {
          navigateTo(`#watch=${encodeURIComponent(item._key)}`);
        });
        row.querySelector(".del-post-btn").addEventListener("click", () => deleteVideo(item._key));
        manageList.appendChild(row);
      });
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderHomeGrid();
      });
    });

    searchInput.addEventListener("input", renderHomeGrid);
    sortSelect.addEventListener("change", (e) => {
      currentSort = e.target.value;
      renderHomeGrid();
    });

    function renderHomeGrid() {
      const q = searchInput.value.trim().toLowerCase();
      const list = allVideos.filter((v) => {
        const src = v.source || (v.telegram_file_id ? "group" : "manual");
        const okTab = currentFilter === "all" || src === currentFilter;
        const okSearch = !q || (v.title || "").toLowerCase().includes(q);
        return okTab && okSearch;
      });

      if (currentSort === "oldest") {
        list.sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
      } else if (currentSort === "az") {
        list.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      } else {
        list.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
      }

      videoCount.textContent = allVideos.length;
      videoGrid.innerHTML = "";

      if (!list.length) {
        videoGrid.innerHTML = `<div class="empty-state">No video posts found.</div>`;
        return;
      }

      list.forEach((item) => {
        const src = item.source || (item.telegram_file_id ? "group" : "manual");
        const tgLink = item.bot_link || item.group_link || "";
        const dateText = item.created_at ? new Date(item.created_at * 1000).toLocaleDateString() : "";

        const card = document.createElement("article");
        card.className = "post-card";
        card.innerHTML = `
          <div class="thumb-box">
            ${item.thumb_url
              ? `<img src="${escapeHtml(item.thumb_url)}" alt="${escapeHtml(item.title || "Video")}" loading="lazy" />`
              : `<div class="no-thumb">No Thumbnail Photo</div>`}
          </div>
          <div class="post-content">
            <div>
              <div class="post-top">
                <span class="${src === "group" ? "badge-group" : "badge-manual"}">
                  ${src === "group" ? "Group Sync" : "Studio"}
                </span>
                <span>${escapeHtml(dateText)}</span>
              </div>
              <div class="post-title">${escapeHtml(item.title || "Untitled Video")}</div>
            </div>
            <div class="post-footer">
              <button class="btn-red watch-open-btn">Watch</button>
              ${tgLink ? `<a class="btn-link btn-indigo" href="${escapeHtml(tgLink)}" target="_blank" rel="noopener noreferrer">Telegram</a>` : ""}
              <button class="btn-ghost copy-link-btn">Copy Link</button>
            </div>
          </div>
        `;

        const goWatch = () => navigateTo(`#watch=${encodeURIComponent(item._key)}`);
        card.querySelector(".thumb-box").addEventListener("click", goWatch);
        card.querySelector(".watch-open-btn").addEventListener("click", goWatch);
        card.querySelector(".copy-link-btn").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(getWatchUrl(item._key));
            showToast("Post link copied");
          } catch {
            showToast("Copy failed");
          }
        });

        videoGrid.appendChild(card);
      });
    }

    async function fetchVideos() {
      try {
        const res = await fetch(`${DB_URL}/videos.json`);
        const data = await res.json();
        allVideos = data && typeof data === "object"
          ? Object.entries(data).map(([key, val]) => ({ _key: key, ...val }))
          : [];
        renderHomeGrid();
        if (isAuthenticated) renderManageList();
        if ((window.location.hash || "").startsWith("#watch=")) {
          const id = decodeURIComponent(window.location.hash.slice("#watch=".length));
          renderWatchView(id);
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    fetchVideos();
    handleRoute();
    setInterval(fetchVideos, 6000);
  </script>
</body>
</html>
